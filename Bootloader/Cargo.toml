[package]
name = "aosp-wear-loader"
version = "17.2.1"
edition = "2024"
rust-version = "1.88"
autobins = false

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "sd-selftest"
path = "tools/diagnostics/sd_selftest.rs"
test = false
bench = false
required-features = ["sd-selftest"]

[features]
default = []
pc-block-boot = []
sd-checked-startup = []
sd-software-spi = []
sd-selftest = ["dep:esp-hal", "dep:esp-backtrace", "dep:esp-alloc", "dep:esp-bootloader-esp-idf"]

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
embedded-hal-bus = "=0.3.0"
esp-hal = { version = "=1.0.0", features = ["esp32s3", "unstable", "psram"], optional = true }
esp-backtrace = { version = "=0.18.1", features = ["esp32s3", "panic-handler", "println"], optional = true }
esp-println = { version = "=0.16.1", features = ["esp32s3"] }
esp-alloc = { version = "=0.9.0", optional = true }
esp-bootloader-esp-idf = { version = "=0.4.0", features = ["esp32s3"], optional = true }
embedded-hal = "=1.0.0"
embedded-sdmmc = { version = "=0.10.0", default-features = false }
embedded-sdmmc-types = "=0.1.0"
heapless = { version = "=0.9.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
