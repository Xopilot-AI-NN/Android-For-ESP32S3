[package]
name = "watch-runtime-check"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "render-watch"
path = "../render_watch.rs"
test = false

[[bin]]
name = "bench-render"
path = "../bench_render.rs"
test = false

[features]
default = ["rhai-runtime", "display-st7789", "radio-services"]
rhai-runtime = []
display-st7789 = []
display-ssd1306 = []
display-diagnostic = []
pc-block-boot = []
sd-software-spi = []
sd-checked-startup = []
sd-selftest = []
radio-services = []

[dependencies]
critical-section = { version = "=1.2.0", features = ["std"] }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
embedded-sdmmc-types = "=0.1.0"
embedded-sdmmc = { version = "=0.10.0", default-features = false }
embedded-hal = "=1.0.0"
embedded-hal-bus = "=0.3.0"
rhai = { version = "=1.25.1", default-features = false, features = ["no_std", "only_i32", "no_float", "no_index", "no_object"] }
heapless = { version = "=0.9.3", default-features = false }

sha2 = { version = "=0.10.9", default-features = false }

[build-dependencies]
cc = "=1.10.0"
