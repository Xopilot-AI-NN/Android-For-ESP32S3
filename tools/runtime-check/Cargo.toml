[package]
name = "watch-runtime-check"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["rhai-runtime", "display-st7789", "radio-services"]
rhai-runtime = []
display-st7789 = []
display-ssd1306 = []
display-diagnostic = []
pc-block-boot = []
radio-services = []

[dependencies]
embedded-hal = "=1.0.0"
rhai = { version = "=1.25.1", default-features = false, features = ["no_std", "only_i32", "no_float", "no_index", "no_object"] }
heapless = { version = "=0.9.3", default-features = false }

sha2 = { version = "=0.10.9", default-features = false }
