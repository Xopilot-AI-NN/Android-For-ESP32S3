<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="500" viewBox="0 0 1260 500"><rect width="1260" height="500" fill="#121c27"/><g font-family="sans-serif" fill="#edf5fc"><text x="24" y="34" font-size="23">Предварительная компоновка · размеры в мм</text><text x="24" y="62" font-size="15">Условная свободная область 50×34: без стоек, проводов и зазоров. Высоты слоёв не определены.</text><text x="24" y="96" font-size="16">Аккумулятор и повышайка</text><rect x="24" y="118" width="270" height="183.6" rx="8" fill="#1c2c3b" stroke="#92b2c7"/><rect x="29.4" y="134.2" width="151.20000000000002" height="145.8" rx="3" fill="#477867"/><text x="34.4" y="152.2" font-size="13">АКБ 28×27</text><rect x="191.4" y="128.8" width="97.2" height="59.400000000000006" rx="3" fill="#426c8e"/><text x="196.4" y="146.8" font-size="13">TPS 18×11</text><text x="24" y="329" font-size="13">Контур 50×34 — ориентир, не посадка</text><text x="332" y="96" font-size="16">Плата ESP и энкодер</text><rect x="332" y="118" width="270" height="183.6" rx="8" fill="#1c2c3b" stroke="#92b2c7"/><rect x="337.4" y="199.0" width="140.4" height="97.2" rx="3" fill="#426c8e"/><text x="342.4" y="217.0" font-size="13">ESP 26×18</text><rect x="510.20000000000005" y="161.2" width="81.0" height="91.80000000000001" rx="3" fill="#966d4b"/><text x="515.2" y="179.2" font-size="13">Энк. 15×17</text><text x="332" y="329" font-size="13">Контур 50×34 — ориентир, не посадка</text><text x="640" y="96" font-size="16">SD и место под радиатор</text><rect x="640" y="118" width="270" height="183.6" rx="8" fill="#1c2c3b" stroke="#92b2c7"/><rect x="715.6" y="123.4" width="189.0" height="97.2" rx="3" fill="#426c8e"/><text x="720.6" y="141.4" font-size="13">SD 35×18</text><rect x="650.8" y="236.8" width="81.0" height="54.0" rx="3" fill="#926c61"/><text x="655.8" y="254.8" font-size="13">15×10</text><text x="640" y="329" font-size="13">Контур 50×34 — ориентир, не посадка</text><text x="948" y="96" font-size="16">Power Path: не размещён</text><rect x="948" y="118" width="270" height="183.6" rx="8" fill="#1c2c3b" stroke="#92b2c7"/><text x="962" y="193" font-size="15">Нужны реальные габариты</text><text x="962" y="218" font-size="15">платы и конденсатора</text><text x="948" y="329" font-size="13">Контур 50×34 — ориентир, не посадка</text><text x="24" y="382" font-size="17">Это проекции предполагаемых уровней, не готовая сборка.</text><text x="24" y="412" font-size="15">Радиатор должен совпасть с положением чипа ESP; энкодер и разъёмы требуют отдельных замеров.</text><text x="24" y="442" font-size="15">SD 35×18 включает запрошенный запас 15 мм для карты; фактическое выступание ещё не измерено.</text></g></svg>