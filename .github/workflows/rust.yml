name: Rust Bootloader Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect files
        run: |
          pwd
          find . -maxdepth 4 -name Cargo.toml -print

      - name: Install ESP Rust Toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build Bootloader
        run: cargo build --manifest-path Bootloader/Cargo.toml --release --verbose
