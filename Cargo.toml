[package]
name = "aosp-wear-firmware"
version = "17.2.1"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
bench = false


[features]
ble-hid = ["radio-services", "dep:trouble-host", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:embassy-time-driver", "dep:rand_core", "dep:bt-hci", "dep:embedded-io"]
default = ["rhai-runtime", "display-st7789", "pc-block-boot", "ble-hid"]
rhai-runtime = ["dep:rhai"]
display-ssd1306 = []
display-st7789 = []
# Explicit opt-in ST7789 physical color diagnostic (no effect by default).
display-diagnostic = ["display-st7789"]
# Independent GPIO SPI bypass for ST7789V3, OFF by default.
display-software-spi = ["display-st7789"]
pc-block-boot = ["aosp-wear-loader/pc-block-boot"]
# Full-duplex GPIO fallback for diagnosing the SD hardware SPI path.
sd-software-spi = ["aosp-wear-loader/sd-software-spi"]
# Opt-in command-level diagnostic startup, independent of the normal driver.
sd-checked-startup = ["aosp-wear-loader/sd-checked-startup"]
radio-services = ["dep:esp-radio", "dep:esp-rtos", "dep:static_cell", "dep:smoltcp", "dep:mbedtls-rs", "dep:tls-rand"]

[dependencies]
aosp-wear-loader = { path = "../Bootloader", default-features = false }
critical-section = "=1.2.0"
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
embedded-sdmmc-types = "=0.1.0"
trouble-host = { version = "=0.5.1", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "security"], optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-sync = { version = "0.7", optional = true }
embassy-time = { version = "0.5", default-features = false, features = ["tick-hz-1_000_000"], optional = true }
embassy-time-driver = { version = "0.2.1", optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
bt-hci = { version = "=0.6.0", default-features = false, optional = true }
embedded-io = { version = "=0.6.1", optional = true }
esp-hal = { version = "=1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-backtrace = { version = "=0.18.1", features = ["esp32s3", "println"] }
esp-println = { version = "=0.16.1", features = ["esp32s3"] }
esp-alloc = "=0.9.0"
esp-bootloader-esp-idf = { version = "=0.4.0", features = ["esp32s3"] }
embedded-hal = "=1.0.0"
embedded-hal-bus = "=0.3.0"
embedded-sdmmc = { version = "=0.10.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
rhai = { version = "=1.25.1", optional = true, default-features = false, features = ["no_std", "only_i32", "no_float", "no_index", "no_object"] }
esp-radio = { version = "=0.17.0", optional = true, default-features = false, features = ["esp32s3", "wifi", "ble", "coex", "esp-alloc", "unstable", "smoltcp"] }
esp-rtos = { version = "=0.2.0", optional = true, features = ["esp32s3", "esp-radio", "esp-alloc"] }
static_cell = { version = "=2.1.1", optional = true }
smoltcp = { version = "=0.12.0", optional = true, default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-dhcpv4", "socket-dns", "socket-tcp", "socket-tcp-reno", "socket-udp"] }
heapless = { version = "=0.9.3", default-features = false }

serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
qrcodegen-no-heap = "=1.8.1"
mbedtls-rs = { version = "=0.1.0", optional = true, features = ["hook-wall-clock", "use-gcc"] }
tls-rand = { package = "rand_core", version = "=0.10.1", optional = true, default-features = false }

[profile.dev]
opt-level = "s"

# Keep the esp-hal 1.0 / esp-radio 0.17 ABI while backporting the upstream
# Xtensa context-restore fix missing from esp-rtos 0.2.0.
[patch.crates-io]
trouble-host = { path = "platform/trouble-host" }
esp-rtos = { path = "platform/esp-rtos" }

[profile.release]
codegen-units = 1
debug = 1
debug-assertions = false
incremental = false
lto = true
opt-level = "z"
overflow-checks = false
panic = "abort"

# Espressif's RF binary/adapter path requires optimization >= 2 for reliable
# Wi-Fi/BLE operation even though the rest of the tiny boot runtime uses `z`.
[profile.release.package.esp-radio]
opt-level = 3

[build-dependencies]
cc = "=1.10.0"
